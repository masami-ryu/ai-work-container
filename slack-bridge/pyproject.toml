[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-bridge"
version = "0.1.0"
description = "Claude Code の対話UI を Slack にバイパスするブリッジ"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.36",
    "slack-bolt>=1.18.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
sb = "src.runner:main"
slack-bridge = "src.runner:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
