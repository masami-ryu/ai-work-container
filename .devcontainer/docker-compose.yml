services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # ワークスペース全体をマウント
      - ..:/workspaces/ai-work-container:cached
      # Codex の認証情報・設定・セッションを rebuild 後も保持
      - codex-data:/home/vscode/.codex
    # コンテナを起動し続ける
    command: sleep infinity
    # ネットワーク設定
    networks:
      - dev-network
networks:
  dev-network:
    driver: bridge

volumes:
  codex-data:
