services:
  playwright-recorder:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    volumes:
      - ..:/workspaces/ai-work-container:cached
    working_dir: /workspaces/ai-work-container/tools/playwright-recorder
    user: "1000:1000"
    command: /usr/local/bin/start-playwright-vnc.sh
    shm_size: 1gb
    ports:
      - "6080:6080"
    networks:
      - dev-network

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ap-northeast-1
    volumes:
      - localstack-data:/var/lib/localstack
    networks:
      - dev-network

volumes:
  localstack-data:
